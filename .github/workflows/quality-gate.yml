name: quality-gate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_quality:
    name: backend-quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend quality dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-dev.lock
      - name: Run Ruff and strict MyPy
        shell: pwsh
        run: ./scripts/quality-gate.ps1 -Scope backend-quality

  backend_tests:
    name: backend-tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: quality_gate
          POSTGRES_USER: quality_gate
          POSTGRES_PASSWORD: quality_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quality_gate -d quality_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://quality_gate:quality_gate@127.0.0.1:5432/quality_gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-dev.lock
      - name: Run complete backend suite against PostgreSQL 17
        shell: pwsh
        run: ./scripts/quality-gate.ps1 -Scope backend-tests

  frontend_quality:
    name: frontend-quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json
      - name: Check and build the administration frontend
        shell: pwsh
        run: ./scripts/quality-gate.ps1 -Scope frontend

  production_contract:
    name: production-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install production backend dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock
      - name: Validate migrations, Compose, and production image
        shell: pwsh
        run: ./scripts/quality-gate.ps1 -Scope production

  release_gate:
    name: release-gate
    if: ${{ always() }}
    needs:
      - backend_quality
      - backend_tests
      - frontend_quality
      - production_contract
    runs-on: ubuntu-24.04
    steps:
      - name: Require every quality job to succeed
        shell: bash
        env:
          BACKEND_QUALITY_RESULT: ${{ needs.backend_quality.result }}
          BACKEND_TESTS_RESULT: ${{ needs.backend_tests.result }}
          FRONTEND_QUALITY_RESULT: ${{ needs.frontend_quality.result }}
          PRODUCTION_CONTRACT_RESULT: ${{ needs.production_contract.result }}
        run: |
          for result in \
            "$BACKEND_QUALITY_RESULT" \
            "$BACKEND_TESTS_RESULT" \
            "$FRONTEND_QUALITY_RESULT" \
            "$PRODUCTION_CONTRACT_RESULT"; do
            test "$result" = "success"
          done
