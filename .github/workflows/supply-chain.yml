name: supply-chain

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VALIDATION_IMAGE: creative-studio:supply-chain-candidate
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436

jobs:
  validate:
    name: image-sbom-vulnerability-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Python locks are reproducible from pyproject.toml
        shell: pwsh
        run: ./scripts/update-python-locks.ps1 -Check
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build the exact production target for scanning
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: ${{ env.VALIDATION_IMAGE }}
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p artifacts
      - name: Create SPDX JSON SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          format: spdx-json
          output-file: artifacts/creative-studio.spdx.json
      - name: Block unapproved Critical or High vulnerabilities
        shell: bash
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD:/workspace" \
            "$TRIVY_IMAGE" image \
            --format sarif \
            --output /workspace/artifacts/trivy.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed=false \
            --ignorefile /workspace/.trivyignore.yaml \
            "$VALIDATION_IMAGE"
      - name: Upload SBOM and vulnerability report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish-signed-image
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create immutable release metadata
        id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build, attest, and push the release image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign every immutable release reference with GitHub OIDC
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r image; do
            cosign sign --yes "${image}@${DIGEST}"
          done <<< "${TAGS}"

  supply_chain_gate:
    name: supply-chain-gate
    if: ${{ always() }}
    needs:
      - validate
      - publish
    runs-on: ubuntu-24.04
    steps:
      - name: Require validation and any applicable publication to succeed
        shell: bash
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          test "$VALIDATE_RESULT" = "success"
          test "$PUBLISH_RESULT" = "success" -o "$PUBLISH_RESULT" = "skipped"
