name: supply-chain

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VALIDATION_IMAGE: creative-studio:supply-chain-candidate
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436

jobs:
  validate:
    name: image-sbom-vulnerability-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Python locks are reproducible from pyproject.toml
        shell: pwsh
        run: ./scripts/update-python-locks.ps1 -Check
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build the exact production target for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: ${{ env.VALIDATION_IMAGE }}
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p artifacts
      - name: Create SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.VALIDATION_IMAGE }}
          format: spdx-json
          output-file: artifacts/creative-studio.spdx.json
      - name: Block unapproved Critical or High vulnerabilities
        shell: bash
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD:/workspace" \
            "$TRIVY_IMAGE" image \
            --format sarif \
            --output /workspace/artifacts/trivy.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed=false \
            --ignorefile /workspace/.trivyignore.yaml \
            "$VALIDATION_IMAGE"
      - name: Upload SBOM and vulnerability report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish-signed-image
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create immutable release metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build, attest, and push the release image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign every immutable release reference with GitHub OIDC
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r image; do
            cosign sign --yes "${image}@${DIGEST}"
          done <<< "${TAGS}"

  supply_chain_gate:
    name: supply-chain-gate
    if: ${{ always() }}
    needs:
      - validate
      - publish
    runs-on: ubuntu-24.04
    steps:
      - name: Require validation and any applicable publication to succeed
        shell: bash
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          test "$VALIDATE_RESULT" = "success"
          test "$PUBLISH_RESULT" = "success" -o "$PUBLISH_RESULT" = "skipped"
