services:
  migrate:
    image: "${CREATIVE_STUDIO_IMAGE:?set CREATIVE_STUDIO_IMAGE to an immutable image tag or digest}"
    init: true
    read_only: true
    environment:
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL to a PostgreSQL psycopg URL}"
    command: ["alembic", "-c", "/app/backend/alembic.ini", "upgrade", "head"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  creative-studio:
    image: "${CREATIVE_STUDIO_IMAGE:?set CREATIVE_STUDIO_IMAGE to an immutable image tag or digest}"
    restart: unless-stopped
    init: true
    read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL to a PostgreSQL psycopg URL}"
      GENERATED_MEDIA_ROOT: /var/lib/infinite-canvas/generated-media
      PROVIDER_SECRETS_ROOT: /var/lib/infinite-canvas/provider-secrets
      PLATFORM_ADMIN_EMAILS: "${PLATFORM_ADMIN_EMAILS:?set PLATFORM_ADMIN_EMAILS}"
      MAX_ACTIVE_GENERATION_TASKS: "${MAX_ACTIVE_GENERATION_TASKS:-500}"
      GENERATION_SUBMISSION_MODE: queued
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-4}"
      WEB_MAX_CONNECTIONS: "${WEB_MAX_CONNECTIONS:-400}"
      WEB_BACKLOG: "${WEB_BACKLOG:-2048}"
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-8}"
      DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:-4}"
      DATABASE_POOL_TIMEOUT_SECONDS: "${DATABASE_POOL_TIMEOUT_SECONDS:-10}"
      AUTH_RATE_LIMIT_HASH_KEY: "${AUTH_RATE_LIMIT_HASH_KEY:?set AUTH_RATE_LIMIT_HASH_KEY to at least 32 random bytes}"
      AUTH_LOGIN_IP_LIMIT: "${AUTH_LOGIN_IP_LIMIT:-10}"
      AUTH_LOGIN_EMAIL_LIMIT: "${AUTH_LOGIN_EMAIL_LIMIT:-5}"
      AUTH_LOGIN_WINDOW_SECONDS: "${AUTH_LOGIN_WINDOW_SECONDS:-600}"
      AUTH_REGISTER_IP_LIMIT: "${AUTH_REGISTER_IP_LIMIT:-5}"
      AUTH_REGISTER_WINDOW_SECONDS: "${AUTH_REGISTER_WINDOW_SECONDS:-3600}"
      AUTH_EMAIL_VERIFICATION_ACCOUNT_LIMIT: "${AUTH_EMAIL_VERIFICATION_ACCOUNT_LIMIT:-3}"
      AUTH_EMAIL_VERIFICATION_WINDOW_SECONDS: "${AUTH_EMAIL_VERIFICATION_WINDOW_SECONDS:-3600}"
      AUTH_PASSWORD_RESET_IP_LIMIT: "${AUTH_PASSWORD_RESET_IP_LIMIT:-5}"
      AUTH_PASSWORD_RESET_EMAIL_LIMIT: "${AUTH_PASSWORD_RESET_EMAIL_LIMIT:-3}"
      AUTH_PASSWORD_RESET_WINDOW_SECONDS: "${AUTH_PASSWORD_RESET_WINDOW_SECONDS:-3600}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:?set ALLOWED_HOSTS to the public domain names}"
      ENABLE_HSTS: "${ENABLE_HSTS:-false}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
    ports:
      - "127.0.0.1:${CREATIVE_STUDIO_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: "${GENERATED_MEDIA_HOST_PATH:?set GENERATED_MEDIA_HOST_PATH to a pre-created host directory}"
        target: /var/lib/infinite-canvas/generated-media
      - type: bind
        source: "${PROVIDER_SECRETS_HOST_PATH:?set PROVIDER_SECRETS_HOST_PATH to a pre-created host directory}"
        target: /var/lib/infinite-canvas/provider-secrets
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s

  generation-worker:
    image: "${CREATIVE_STUDIO_IMAGE:?set CREATIVE_STUDIO_IMAGE to an immutable image tag or digest}"
    restart: unless-stopped
    init: true
    read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL to a PostgreSQL psycopg URL}"
      GENERATED_MEDIA_ROOT: /var/lib/infinite-canvas/generated-media
      PROVIDER_SECRETS_ROOT: /var/lib/infinite-canvas/provider-secrets
      PLATFORM_ADMIN_EMAILS: "${PLATFORM_ADMIN_EMAILS:?set PLATFORM_ADMIN_EMAILS}"
      MAX_ACTIVE_GENERATION_TASKS: "${MAX_ACTIVE_GENERATION_TASKS:-500}"
      GENERATION_SUBMISSION_MODE: queued
      DATABASE_POOL_SIZE: "${WORKER_DATABASE_POOL_SIZE:-2}"
      DATABASE_MAX_OVERFLOW: "${WORKER_DATABASE_MAX_OVERFLOW:-1}"
      DATABASE_POOL_TIMEOUT_SECONDS: "${DATABASE_POOL_TIMEOUT_SECONDS:-10}"
      AUTH_RATE_LIMIT_HASH_KEY: "${AUTH_RATE_LIMIT_HASH_KEY:?set AUTH_RATE_LIMIT_HASH_KEY to at least 32 random bytes}"
      AUTH_LOGIN_IP_LIMIT: "${AUTH_LOGIN_IP_LIMIT:-10}"
      AUTH_LOGIN_EMAIL_LIMIT: "${AUTH_LOGIN_EMAIL_LIMIT:-5}"
      AUTH_LOGIN_WINDOW_SECONDS: "${AUTH_LOGIN_WINDOW_SECONDS:-600}"
      AUTH_REGISTER_IP_LIMIT: "${AUTH_REGISTER_IP_LIMIT:-5}"
      AUTH_REGISTER_WINDOW_SECONDS: "${AUTH_REGISTER_WINDOW_SECONDS:-3600}"
      AUTH_EMAIL_VERIFICATION_ACCOUNT_LIMIT: "${AUTH_EMAIL_VERIFICATION_ACCOUNT_LIMIT:-3}"
      AUTH_EMAIL_VERIFICATION_WINDOW_SECONDS: "${AUTH_EMAIL_VERIFICATION_WINDOW_SECONDS:-3600}"
      AUTH_PASSWORD_RESET_IP_LIMIT: "${AUTH_PASSWORD_RESET_IP_LIMIT:-5}"
      AUTH_PASSWORD_RESET_EMAIL_LIMIT: "${AUTH_PASSWORD_RESET_EMAIL_LIMIT:-3}"
      AUTH_PASSWORD_RESET_WINDOW_SECONDS: "${AUTH_PASSWORD_RESET_WINDOW_SECONDS:-3600}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:?set ALLOWED_HOSTS to the public domain names}"
      ENABLE_HSTS: "${ENABLE_HSTS:-false}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      GENERATION_WORKER_POLL_SECONDS: "${GENERATION_WORKER_POLL_SECONDS:-0.5}"
      GENERATION_WORKER_BATCH_SIZE: "${GENERATION_WORKER_BATCH_SIZE:-20}"
      GENERATION_WORKER_CONCURRENCY: "${GENERATION_WORKER_CONCURRENCY:-5}"
      GENERATION_WORKER_DEPLOYED_LIMIT: "${GENERATION_WORKER_REPLICAS:-10}"
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    volumes:
      - type: bind
        source: "${GENERATED_MEDIA_HOST_PATH:?set GENERATED_MEDIA_HOST_PATH to a pre-created host directory}"
        target: /var/lib/infinite-canvas/generated-media
      - type: bind
        source: "${PROVIDER_SECRETS_HOST_PATH:?set PROVIDER_SECRETS_HOST_PATH to a pre-created host directory}"
        target: /var/lib/infinite-canvas/provider-secrets
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 5m
    deploy:
      replicas: ${GENERATION_WORKER_REPLICAS:-10}
